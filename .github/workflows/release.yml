name: Plugin Store Release

# Builds the plugin and attaches the Plugin Store package to the GitHub Release that triggered
# it (<id>-<version>-any.zip, plugin.json, SHA256SUMS), using the reusable workflow from the
# LoupixDeck Plugin SDK. A manual run only produces the files as a workflow artifact.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    uses: RadiatorTwo/LoupixDeck.PluginSdk/.github/workflows/plugin-release.yml@master
    with:
      project: LoupixDeck.Plugin.Claude.csproj
      build-sdk: false   # the SDK version we reference is published on nuget.org
